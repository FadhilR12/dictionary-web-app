<!DOCTYPE html>
<html x-data="app()" lang="en" x-bind:class="active ? 'dark': ''">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./output.css">
  <title>Frontend Mentor | Dictionary web app</title>
</head>

<body class="dark:bg-black dark:text-white">
  <div
    class="flex flex-col items-center font-lora mt-[24px] md:mt-[58px] min-w-[375px] md:min-w-[768px] lg:min-w-[1440px] min-h-screen"
    x-bind:class="{
      'font-inter' : font == 1,
      'font-lora': font == 2,
      'font-inconsolata': font == 3
    }">
    <div class="flex flex-col items-center gap-[24px] md:gap-[56px]">
      <!-- header -->
      <div class="flex flex-row justify-between items-center w-full">

        <!-- logo -->
        <div class="w-fit"><img class="w-[28px]" src="./assets/images/logo.svg" alt=""></div>

        <!-- control -->
        <div class="flex flex-row gap-[16px] items-center">
          <div class="flex flex-row items-center gap-[16px] cursor-pointer relative" @click="toggleModal()">
            <span class="text-[14px] leading-[1.7] font-bold" x-text="currFont"></span>
            <img src="./assets/images/icon-arrow-down.svg" alt="">

            <!-- dropDown -->
            <div
              class="md:w-[183px] w-[122px] h-[152px] bg-white dark:bg-black dark:shadow-[0_5px_30px_0_#A445ED] shadow-[0_5px_30px_0_rgba(0,0,0,0.1)] md:px-[24px] md:py-[24px] px-[16px] py-[24px] rounded-[16px] absolute top-[41px] right-[-14px] md:right-0 flex flex-col gap-[16px] md:text-[18px] md:leading-[1.33] text-[14px] leading-[1.7] font-bold"
              x-show="open">
              <div class="font-inter cursor-pointer hover:text-purple-500" @click="font = 1">
                <p>Sans Serif</p>
              </div>
              <div class="font-lora cursor-pointer hover:text-purple-500" @click="font = 2">
                <p>Serif</p>
              </div>
              <div class="font-inconsolata cursor-pointer hover:text-purple-500" @click="font = 3">
                <p>Mono</p>
              </div>
            </div>
          </div>

          <!-- divider -->
          <div class="w-[1px] h-full bg-[#979797]"></div>

          <!-- night mode -->
          <div class="flex flex-row items-center gap-[10px]">
            <div class="rounded-[10px] cursor-pointer w-[40px] h-[20px] relative" @click="active = !active"
              x-bind:class="active ? 'bg-purple-600' : 'bg-[#979797]'">
              <div class="bg-white absolute rounded-full top-[3px]  w-[14px] h-[14px]"
                x-bind:class="active ? 'right-[3px]': 'left-[3px]'"></div>
            </div>
            <div>
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
                <path fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M1 10.449a10.544 10.544 0 0 0 19.993 4.686C11.544 15.135 6.858 10.448 6.858 1A10.545 10.545 0 0 0 1 10.449Z"
                  class="stroke-[#838383] dark:stroke-purple-500" />
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Search box -->
      <div class="flex flex-col gap-[8px]">
        <div
          class="flex flex-row items-center bg-neutral-100 dark:bg-neutral-900 dark:text-white p-[24px] rounded-[16px] md:w-[689px] lg:w-[736px] w-[327px] h-[48px]"
          x-bind:class="err ? 'border border-red-500' : '' ">
          <div class="flex flex-row items-center">
            <input class="w-70 md:w-155 lg:w-170 placeholder:font-bold" id="search" type="text"
              class="text-[16px]z font-bold leading-[1.2]" placeholder="Search for any word…" x-model="searchText">
            <div @click="fetchData()"><img src="./assets/images/icon-search.svg" alt=""></div>
          </div>
        </div>
        <div x-show="err">
          <p class="text-red-500">Whoops, can't be empty</p>
        </div>
      </div>

    </div>

    <!-- items -->
    <div class="flex flex-col items-center w-[327px] md:w-[689px] lg:w-[736px] pt-[24px] md:pt-[48px]"
      x-show="data != null && !loading && !initial">
      <!-- h1 -->
      <div class="flex flex-row items-center w-full gap-[140px] md:gap-[327px] lg:gap-[370px] pb-[30px]">
        <div class="flex flex-col w-[120px] md:w-[280px] text-left text-left md:gap-[8px]">
          <p class="text-[32px] font-bold leading-[1.3] md:text-[64px]" x-text="data?.word"></p>
          <p class="text-purple-500 font-inter text-[18px] md:font-light md:text-[24px] md:leading-[1.2] leading-[1.33]"
            x-text="data?.pronunciation">
            /ˈkiːbɔːd/</p>
        </div>
        <div>
          <svg xmlns="http://www.w3.org/2000/svg" width="75" height="75" viewBox="0 0 75 75">
            <g fill="#A445ED" fill-rule="evenodd">
              <circle cx="37.5" cy="37.5" r="37.5" opacity=".25" />
              <path d="M29 27v21l21-10.5z" />
            </g>
          </svg>
        </div>
      </div>

      <!-- synonyms -->
      <div class="flex flex-row gap-[24px] w-full pb-15 items-start" x-show="data?.synonyms.length > 0">
        <span class="text-[16px] md:text-[20px] md:leading-[1.3] leading-[1.2] text-neutral-500">Synonyms</span>
        <div class="flex flex-wrap gap-x-8 gap-y-2 min-w-0">
          <template x-for="(item, index) in data?.synonyms" :key="index">
            <span class="text-[20px] leading-[1.3] text-purple-500
                       hover:border-b cursor-pointer font-bold" x-text="item"></span>
          </template>
        </div>

      </div>

      <template x-for="(item, index) in data?.partsOfSpeech" :key="index">
        <div>
          <div class="flex flex-row gap-[20px] items-center w-full pb-[32px]">
            <div>
              <p class="text-[18px] md:text-[24px] md:leading-[1.2] font-bold italic leading-[1.27]"
                x-text="item.partOfSpeech">noun</p>
            </div>
            <div class="h-[1px] w-full bg-[#979797]"></div>
          </div>
          <div
            class="flex flex-col text-neutral-800 dark:text-white text-[15px] leading-[1.6] w-[327px] md:w-[689px] lg:w-[736px] md:text-[18px] md:leading-[1.33]">

            <!-- list -->
            <p class="pb-[24px] text-[16px] leading-[1.2] md:text-[20px] md:leading-[1.3] text-neutral-500">
              Meaning
            </p>

            <template x-for="(senses, index) in item.senses" :key="index">
              <ul class="flex flex-col gap-[12px] pb-[24px]">
                <li class="flex flex-col gap-[12px]">
                  <div class="flex flex-row  gap-[20px]">
                    <span class="rounded-full mt-[10px] min-w-[5px] h-[5px] bg-purple-600"></span>
                    <p x-text="senses.definition"></p>
                  </div>
                  <p class="pl-6 text-neutral-500" x-text="senses.example"></p>
                </li>
              </ul>
            </template>
          </div>
      </template>
    </div>

    <div class="flex flex-col w-[327px] pt-[32px] md:w-[689px] lg:w-[736px]" x-show="data != null && !loading && !initial">
      <!-- divider -->
      <div class="h-[1px] w-full bg-[#979797] mb-[32px]"></div>

      <!-- source -->
      <div class="flex flex-col gap-[8px] pb-[72px] md:flex-row md:gap-[20px] text-[14px] leading-[1.3]">
        <p class="border-b-1  text-neutral-500 w-fit ">Source</p>
        <div class="flex flex-row items-center gap-[10px]">
          <span class="border-b-1 hover:text-purple-500"><a x-text="sourceText">
              https://en.wiktionary.org/wiki/keyboard
            </a></span>
          <span><img src="./assets/images/icon-new-window.svg" alt=""></span>
        </div>
      </div>

    </div>

    <div x-show="!loading && !initial" class="flex flex-col mt-[50px]">
    <!-- loading -->
      <div class="w-full h-full text-[100px] font-bold text-purple-600 text-center">LOADING...</div>
    </div>

    <!-- initial -->
     <div x-show="!loading && initial" class="flex flex-col mt-[50px]">
        <div class="w-full h-full text-[50px] font-bold text-purple-600 text-center">
          Search everyword you know ^U^
        </div>
     </div>

  </div>
  </div>

  <script>
    function app() {
      return {
        open: false,
        font: 1,
        active: false,
        data: null,
        searchText: '',
        err: false,
        loading: false,
        initial: true,

        get sourceText() {
          return 'https://en.wiktionary.org/wiki/' + this.searchText
        },

        init() {
          this.$watch('searchText', value => console.log(value))
        },
        toggleModal() {
          this.open = !this.open
        },

        get currFont() {
          if (this.font == 1) {
            return "Sans Serif"
          } else if (this.font == 2) {
            return "Serif"
          } else {
            return "Mono"
          }
        },
        async fetchData() {
          if (this.searchText.length < 1) {
            this.err = true
            return
          }
          this.err = false
          this.initial = false
          this.loading = true
          fetch("https://englishdictionaryapi.com/api/v1/words/" + this.searchText)
            .then((response) => response.json())
            .then((result) => {
              this.data = {
                word: result.word,
                pronunciation: result.pronunciation.ipa,
                audio: result.pronunciation.audioUrl,

                partsOfSpeech: result.partsOfSpeech,
                synonyms: result.synonyms,
              }

              console.log(JSON.stringify(this.data))

            })
          this.loading = false
        }
      }
    }

  </script>
</body>

</html>
